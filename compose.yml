# To execute this compose file use `docker compose up`
# Add the `-d` flag at the end for detached execution
# Copy .env.example to .env and fill in your values before starting
services:
  grafana:
    image: grafana/grafana:13.0.1@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
    container_name: grafana
    user: "1000:1000"
    environment:
      # Grafana built-in env vars that set the admin login credentials on first start
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Passed through so the datasource provisioning file can interpolate them
      - INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  influxdb:
    image: influxdb:1.12.4@sha256:e9363fd88d67f8ae6f019f37a30cc136e3644f2cbaea5abd71ad63c96dc6ae08
    container_name: influxdb
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "influx", "-username", "${INFLUXDB_ADMIN_USER}", "-password", "${INFLUXDB_ADMIN_PASSWORD}", "-execute", "SHOW DATABASES"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - INFLUXDB_HTTP_AUTH_ENABLED=true
      - INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - INFLUXDB_DB=collectd
    volumes:
      - ./influxdb.conf:/etc/influxdb/influxdb.conf
      - ./types.db:/usr/share/collectd/types.db
      - ./influxdb_data:/var/lib/influxdb
    ports:
      - "8086:8086"
      - "25826:25826/udp"

  collectd:
    build:
      context: ./collectd-fritzbox
    image: jammsen/collectd-fritzbox:latest
    network_mode: host
    container_name: collectd-fritzbox
    environment:
      - TIMEZONE=${TIMEZONE}
      - CheckInterval=${CHECK_INTERVAL}
      - InfluxDbIp=${INFLUXDB_HOST}
      - InfluxDbCollectdPort=${INFLUXDB_COLLECTD_PORT}
      - FritzBoxIp=${FRITZBOX_IP}
      - FritzBoxUser=${FRITZBOX_USER}
      - FritzBoxPassword=${FRITZBOX_PASSWORD}
    depends_on:
      influxdb:
        condition: service_healthy
